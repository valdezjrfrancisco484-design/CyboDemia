<style>
.lang-selector {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin: 20px 0;
}

.lang-circle {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid #93ccf8;
  cursor: pointer;
  transition: 0.3s;
}

.lang-circle.active {
  background-color: #93ccf8;
  box-shadow: 0 0 10px #93ccf8;
}

.lang-label {
  text-align: center;
  color: #93ccf8;
  font-size: 14px;
  margin-top: 8px;
}
</style>

<!-- ===== LANGUAGE SELECTOR ===== -->
<div class="lang-selector">
  <div class="lang-circle active" data-lang="en" title="English"></div>
  <div class="lang-circle" data-lang="fil" title="Filipino"></div>
  <div class="lang-circle" data-lang="es" title="Spanish"></div>
  <div class="lang-circle" data-lang="jp" title="Japanese"></div>
  <div class="lang-circle" data-lang="kr" title="Korean"></div>
</div>

<p class="lang-label" id="langLabel">English</p>

<!-- ===== YOUR WEBSITE TEXT (EXAMPLE: WORKS ANYWHERE) ===== -->
<h2 data-i18n="title">Quick Cybersecurity Quiz</h2>
<p data-i18n="subtitle">Test your knowledge and stay cyber-safe!</p>

<button data-i18n="submit">Submit Answers</button>

<p data-i18n="intro">Welcome to the cybersecurity learning page.</p>

<!-- ===== JS SYSTEM ===== -->
<script>
const translations = {
  en: {
    title: "Quick Cybersecurity Quiz",
    subtitle: "Test your knowledge and stay cyber-safe!",
    submit: "Submit Answers",
    intro: "Welcome to the cybersecurity learning page."
  },
  fil: {
    title: "Mabilis na Cybersecurity Quiz",
    subtitle: "Subukin ang iyong kaalaman at manatiling ligtas online!",
    submit: "I-submit ang Sagot",
    intro: "Maligayang pagdating sa cybersecurity learning page."
  },
  es: {
    title: "Cuestionario Rápido de Ciberseguridad",
    subtitle: "¡Pon a prueba tu conocimiento y mantente seguro!",
    submit: "Enviar Respuestas",
    intro: "Bienvenido a la página de aprendizaje de ciberseguridad."
  },
  jp: {
    title: "サイバーセキュリティクイズ",
    subtitle: "知識をテストして安全を保ちましょう！",
    submit: "送信",
    intro: "サイバーセキュリティ学習ページへようこそ。"
  },
  kr: {
    title: "사이버 보안 퀴즈",
    subtitle: "지식을 테스트하고 안전하게 유지하세요!",
    submit: "제출",
    intro: "사이버 보안 학습 페이지에 오신 것을 환영합니다."
  }
};

const circles = document.querySelectorAll(".lang-circle");
const langLabel = document.getElementById("langLabel");

function applyLanguage(lang) {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (translations[lang][key]) {
      el.textContent = translations[lang][key];
    }
  });

  langLabel.textContent =
    lang === "en" ? "English" :
    lang === "fil" ? "Filipino" :
    lang === "es" ? "Spanish" :
    lang === "jp" ? "Japanese" :
    "Korean";

  localStorage.setItem("lang", lang);
}

circles.forEach(circle => {
  circle.addEventListener("click", () => {
    circles.forEach(c => c.classList.remove("active"));
    circle.classList.add("active");

    applyLanguage(circle.dataset.lang);
  });
});

/* load saved language */
const savedLang = localStorage.getItem("lang") || "en";
applyLanguage(savedLang);

circles.forEach(c => {
  if (c.dataset.lang === savedLang) {
    c.classList.add("active");
  }
});
</script>
